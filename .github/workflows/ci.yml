name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Install IDL toolchain
        run: ./scripts/install-tools.sh
      - name: Gen check (model ↔ idl 同步)
        run: CHECK=1 ./scripts/gen-model.sh
      - name: Gen check (openapi ↔ idl 同步)
        run: go run ./cmd/gen-openapi --check
      - name: Gen check (ts ↔ idl 同步)
        run: go run ./cmd/gen-ts --check
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Dep guard(contracts 零项目内依赖)
        run: |
          BAD=$(go list -deps ./... | grep -E '^github.com/filescodebox/' | grep -Ev '^github.com/filescodebox/contracts(/|$)' || true)
          if [ -n "$BAD" ]; then echo "✗ contracts 违规依赖:"; echo "$BAD"; exit 1; fi
          echo "✓ 依赖方向合规"
